display_information:
  name: Showcase Bot
  description: A tour of what a Slack app can do, wired to Alejo's GitHub and Claude.
  background_color: "#1d3557"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Showcase Bot
    always_online: true
  assistant_view:
    assistant_description: Ask about Alejo's GitHub repos, or anything else.
    suggested_prompts:
      - title: What changed this week?
        message: What did I push across my repos this week?
      - title: Explain a repo
        message: Explain what the slack-moderation-bot repo does and how it's deployed.
      - title: Draft an issue
        message: Draft a GitHub issue for adding tests to slack-moderation-bot.
  shortcuts:
    - name: Quick capture
      type: global
      callback_id: quick_capture
      description: Save a to-do to your Showcase Home tab
    - name: Create GitHub issue
      type: message
      callback_id: message_to_issue
      description: Turn this message into an issue in one of your repos
    - name: Summarize with Claude
      type: message
      callback_id: summarize_thread
      description: Summarize this message and its thread
  slash_commands:
    - command: /showcase
      description: Open the menu of everything this bot can do
      should_escape: false
    - command: /repo
      description: Show a live card for one of your GitHub repos
      usage_hint: "[repo name]"
      should_escape: false
    - command: /poll
      description: Start a poll with live-updating results
      usage_hint: '"Question?" "Option 1" "Option 2"'
      should_escape: false
    - command: /todo
      description: Add a to-do to your Home tab, or list them
      usage_hint: "[text]"
      should_escape: false
    - command: /ask
      description: Ask Claude; the answer streams in
      usage_hint: "[question]"
      should_escape: false
    - command: /later
      description: Schedule a message to yourself
      usage_hint: "10m Remember to stretch"
      should_escape: false
  unfurl_domains:
    - github.com
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - bookmarks:read
      - bookmarks:write
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - chat:write.customize
      - chat:write.public
      - commands
      - emoji:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - links:read
      - links:write
      - lists:read
      - lists:write
      - metadata.message:read
      - mpim:history
      - mpim:read
      - mpim:write
      - pins:read
      - pins:write
      - reactions:read
      - reactions:write
      - team:read
      - usergroups:read
      - users.profile:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - assistant_thread_context_changed
      - assistant_thread_started
      - function_executed
      - link_shared
      - message.im
      - reaction_added
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: true
  function_runtime: remote
  token_rotation_enabled: false
functions:
  create_github_issue:
    title: Create a GitHub issue
    description: Opens an issue in one of Alejo's repos
    input_parameters:
      properties:
        repo:
          type: string
          title: Repository
          description: Repo name under alejoacelas, e.g. slack-moderation-bot
        title:
          type: string
          title: Issue title
        body:
          type: string
          title: Issue body
      required:
        - repo
        - title
    output_parameters:
      properties:
        issue_url:
          type: string
          title: Issue URL
      required:
        - issue_url
